name: ServiceHub CI - Test Pipeline

on:
  pull_request:
    branches:
      - master

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código do repositório
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 2. Configura o ambiente Java 21 (igual ao utilizado no projeto)
      - name: Configurar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # 3. Executa a limpeza e os testes (unitários e integrados) via Maven
      - name: Executar Testes com Maven
        run: mvn clean test

      # 4. (Opcional) Gera o pacote JAR caso todos os testes passem com sucesso
      - name: Empacotar Aplicação (Build)
        run: mvn package -DskipTests
